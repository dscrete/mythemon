name: Package tagged release

on:
  push:
    branches:
      - main
    paths:
      - .release

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="$(tr -d '[:space:]' < .release)"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag in .release: $tag" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "ZIP_PATH=dist/mythmon-${tag}.zip" >> "$GITHUB_ENV"

      - name: Validate PNG assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct
          import zlib

          expected = {
              "aeglet_front.png": (40, 40),
              "aeglet_back.png": (32, 32),
              "aeglet_icon.png": (16, 32),
          }

          for name, dimensions in expected.items():
              path = Path("assets") / name
              data = path.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{path}: invalid PNG signature")

              pos = 8
              saw_ihdr = False
              saw_iend = False
              while pos < len(data):
                  if pos + 12 > len(data):
                      raise SystemExit(f"{path}: truncated PNG chunk")
                  length = struct.unpack(">I", data[pos:pos + 4])[0]
                  kind = data[pos + 4:pos + 8]
                  end = pos + 12 + length
                  if end > len(data):
                      raise SystemExit(f"{path}: truncated {kind!r} chunk")
                  payload = data[pos + 8:pos + 8 + length]
                  stored_crc = struct.unpack(">I", data[pos + 8 + length:end])[0]
                  actual_crc = zlib.crc32(kind)
                  actual_crc = zlib.crc32(payload, actual_crc) & 0xffffffff
                  if stored_crc != actual_crc:
                      raise SystemExit(
                          f"{path}: CRC mismatch in {kind.decode('ascii', 'replace')} chunk"
                      )
                  if kind == b"IHDR":
                      width, height = struct.unpack(">II", payload[:8])
                      bit_depth = payload[8]
                      color_type = payload[9]
                      if (width, height) != dimensions:
                          raise SystemExit(
                              f"{path}: expected {dimensions[0]}x{dimensions[1]}, "
                              f"got {width}x{height}"
                          )
                      if bit_depth != 8 or color_type not in (4, 6):
                          raise SystemExit(
                              f"{path}: sprite must be an 8-bit PNG with an alpha channel"
                          )
                      saw_ihdr = True
                  if kind == b"IEND":
                      saw_iend = True
                      pos = end
                      break
                  pos = end

              if not saw_ihdr or not saw_iend or pos != len(data):
                  raise SystemExit(f"{path}: incomplete or trailing PNG data")
              print(f"validated {path}")
          PY

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          stage="dist/mythmon"
          mkdir -p "$stage"

          cp manifest.json main.lua README.md CHANGELOG.md "$stage/"
          cp -R assets "$stage/assets"
          if [ -d tools ]; then cp -R tools "$stage/tools"; fi

          (
            cd dist
            zip -r "mythmon-${RELEASE_TAG}.zip" mythmon
          )

      - name: Create tagged prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="Automated Mythmon build ${RELEASE_TAG} from commit ${GITHUB_SHA}. Extract the top-level mythmon directory into Gen1Recomp's mods directory."

          gh release create "$RELEASE_TAG" "$ZIP_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Mythmon ${RELEASE_TAG}" \
            --notes "$notes" \
            --prerelease
