name: Package tagged release

on:
  push:
    branches:
      - main
    paths:
      - .release

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="$(tr -d '[:space:]' < .release)"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag in .release: $tag" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "ZIP_PATH=dist/mythmon-${tag}.zip" >> "$GITHUB_ENV"

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          stage="dist/mythmon"
          mkdir -p "$stage"

          cp manifest.json main.lua README.md CHANGELOG.md "$stage/"
          cp -R assets "$stage/assets"
          if [ -d tools ]; then cp -R tools "$stage/tools"; fi

          (
            cd dist
            zip -r "mythmon-${RELEASE_TAG}.zip" mythmon
          )

      - name: Create tagged prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="Automated Mythmon build ${RELEASE_TAG} from commit ${GITHUB_SHA}. Extract the top-level mythmon directory into Gen1Recomp's mods directory."

          gh release create "$RELEASE_TAG" "$ZIP_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Mythmon ${RELEASE_TAG}" \
            --notes "$notes" \
            --prerelease
